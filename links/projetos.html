<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projetos | Manoel Monteiro</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../style.css">

  <style>
    :root { --grad: linear-gradient(to right, #e91e63, #2196f3); }

    .topo h1 { margin-bottom: 0; }

    .pj { width: 80%; max-width: 1000px; }

    .pj-intro {
      color: #333;
      font-size: 1.05rem;
      line-height: 1.6;
      margin: 0 0 28px;
      max-width: 680px;
    }

    /* ---------- cards de projeto ---------- */
    .pj-lista { display: flex; flex-direction: column; gap: 36px; }

    .pj-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .pj-card:hover {
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.16);
      transform: translateY(-3px);
    }

    .pj-principal {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    }

    .pj-capa {
      border: 0;
      padding: 0;
      margin: 0;
      cursor: zoom-in;
      background: #f1f1f1;
      position: relative;
      min-height: 240px;
    }

    .pj-capa img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .pj-capa:hover img { transform: scale(1.03); }

    /* capas que são prints de tela: mostrar o canto superior esquerdo */
    .pj-capa.tela img { object-position: left top; }
    /* capas que são gráficos: mostrar inteiro */
    .pj-capa.grafico { background: #fff; }
    .pj-capa.grafico img { object-fit: contain; padding: 12px; box-sizing: border-box; }

    .pj-capa span {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-size: 0.75rem;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .pj-info { padding: 22px 24px; display: flex; flex-direction: column; }

    .pj-cat {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #e91e63;
      margin: 0 0 4px;
    }

    .pj-info h2 {
      font-family: minhaFonte, sans-serif;
      font-size: 1.45rem;
      line-height: 1.25;
      margin: 0 0 10px;
      color: #161616;
    }

    .pj-desc { color: #555; font-size: 0.95rem; line-height: 1.55; margin: 0 0 12px; }

    .pj-destaques {
      list-style: none;
      padding: 0;
      margin: 0 0 14px;
      font-size: 0.88rem;
      color: #444;
    }

    .pj-destaques li { position: relative; padding-left: 18px; margin-bottom: 4px; }

    .pj-destaques li::before {
      content: "✦";
      position: absolute;
      left: 0;
      color: #2196f3;
      font-size: 0.7rem;
      top: 3px;
    }

    .pj-techs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 18px; }

    .pj-tech {
      font-size: 0.75rem;
      padding: 2px 9px;
      border-radius: 6px;
      background: #f1f4f8;
      color: #2b7fa7;
    }

    .pj-acoes { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }

    .pj-btn {
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid #ddd;
      color: #333;
      transition: 0.2s ease;
    }

    .pj-btn:hover { border-color: #2196f3; color: #2196f3; }

    .pj-btn.primario { border: 0; background: var(--grad); color: #fff; }
    .pj-btn.primario:hover { opacity: 0.88; color: #fff; }

    /* faixa de telas */
    .pj-telas {
      display: flex;
      gap: 10px;
      padding: 14px 24px 18px;
      overflow-x: auto;
      border-top: 1px solid #eee;
      scrollbar-width: thin;
    }

    .pj-telas button {
      flex: 0 0 auto;
      border: 0;
      padding: 0;
      background: none;
      cursor: zoom-in;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      outline-offset: 2px;
    }

    .pj-telas img {
      display: block;
      height: 86px;
      width: 140px;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .pj-telas button:hover img { transform: scale(1.08); }

    /* ---------- visualizador ---------- */
    .pj-lb {
      border: 0;
      padding: 0;
      background: transparent;
      max-width: 100vw;
      max-height: 100vh;
      width: 100vw;
      height: 100vh;
    }

    .pj-lb::backdrop { background: rgba(10, 10, 15, 0.88); }

    .pj-lb-corpo {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px 64px;
      box-sizing: border-box;
    }

    .pj-lb img {
      max-width: 100%;
      max-height: calc(100vh - 110px);
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      background: #fff;
    }

    .pj-lb p { color: #eee; margin: 0; font-size: 0.95rem; text-align: center; }
    .pj-lb p small { color: #aaa; margin-left: 8px; }

    .pj-lb-btn {
      position: fixed;
      border: 0;
      cursor: pointer;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 1.3rem;
      line-height: 1;
      transition: background 0.2s ease;
    }

    .pj-lb-btn:hover { background: #e91e63; }
    .pj-lb-fechar { top: 16px; right: 16px; }
    .pj-lb-ant { left: 12px; top: 50%; transform: translateY(-50%); }
    .pj-lb-prox { right: 12px; top: 50%; transform: translateY(-50%); }

    @media (max-width: 760px) {
      .pj, .topo { width: 90%; }
      .topo h1 { font-size: 1.9rem; }
      a.voltar { padding: 10px 18px; font-size: 0.9rem; white-space: nowrap; }
      .pj-principal { grid-template-columns: 1fr; }
      .pj-capa { min-height: 0; aspect-ratio: 16 / 9; }
      .pj-info { padding: 18px; }
      .pj-telas { padding: 12px 18px 16px; }
      .pj-lb-corpo { padding: 60px 12px 20px; }
      .pj-lb-ant, .pj-lb-prox { top: auto; bottom: 16px; transform: none; }
      .contato a { margin: 4px 8px; }
    }
  </style>
</head>

<body>
  <div class="topo">
    <h1>Meus Projetos</h1>
    <a href="../" class="voltar">← Voltar</a>
  </div>

  <main class="pj">
    <p class="pj-intro">
      Alguns projetos pessoais e que construí na faculdade, de IA aplicada a sistemas web e visão computacional.
      Clique numa imagem para ver as telas em tamanho grande.
    </p>

    <div class="pj-lista" id="lista" aria-live="polite"></div>
  </main>

  <dialog class="pj-lb" id="lb" aria-label="Telas do projeto">
    <div class="pj-lb-corpo">
      <img id="lb-img" alt="">
      <p id="lb-legenda"></p>
    </div>
    <button type="button" class="pj-lb-btn pj-lb-fechar" data-lb="fechar" aria-label="Fechar">✕</button>
    <button type="button" class="pj-lb-btn pj-lb-ant" data-lb="-1" aria-label="Tela anterior">←</button>
    <button type="button" class="pj-lb-btn pj-lb-prox" data-lb="1" aria-label="Próxima tela">→</button>
  </dialog>

  <div class="contato">
    <a href="../Cv_abril_19_26.pdf">CV</a>
    <a href="mailto:manoell2002@gmail.com">EMAIL</a>
    <a href="https://github.com/manoelmonteiro">GITHUB</a>
    <a href="https://www.linkedin.com/in/manoel-monteiro-445648182/">LINKEDIN</a>
    <a href="https://discord.com/users/308303160076795904">DISCORD</a>
    <a href="https://www.instagram.com/manoel.io/">INSTAGRAM</a>
  </div>

  <div class="footer">© 2026 Manoel Monteiro — Todos os direitos reservados.</div>

  <script>

    const PROJETOS = [

        ],
        techs: ["Python", "FastAPI", "Pydantic", "React", "Vite", "Groq API", "Whisper", "pytubefix", "Linux"],

        descricao: "Jogos e wiki sobre a cultura de Sergipe para a sala de aula: o professor cria a turma, os alunos entram com um código e os pontos vão para o ranking.",
        destaques: [

          "API FastAPI validada com Pydantic, 11 testes e CI no GitHub Actions",

        ],
        techs: ["Python", "FastAPI", "Pydantic", "pytest", "JavaScript", "HTML", "CSS", "Material Design 3", "GitHub Actions", "Vercel"],
        detalhes: "../meusprojetos/culturaSergipe.html",
        codigo: "https://github.com/Manoelmonteiro/mvp-gamesculture",
        site: "https://manoelmonteiro.github.io/mvp-gamesculture/",
        capa: "tela",
        telas: [
          { src: "../images/culturase/index.png", legenda: "Página inicial" },
          { src: "../images/culturase/onde-fica.png", legenda: "Jogo Onde Fica?" },
          { src: "../images/culturase/material-imaterial.png", legenda: "Jogo Material ou Imaterial?" },
          { src: "../images/culturase/licoes.png", legenda: "Lições em níveis" },
          { src: "../images/culturase/wiki.png", legenda: "Wiki Sergipana" },
          { src: "../images/culturase/turmas.png", legenda: "Turmas virtuais" }
        ]
      },
      {
        titulo: "PharmaManager — Gestão de Farmácia",
        categoria: "Web · Banco de dados · Em equipe",
        descricao: "Sistema web para gerenciar funcionários, clientes, produtos, estoque, vendas, fornecedores e despesas de uma farmácia.",
        destaques: [
          "Banco relacional com 13 tabelas e herança JOINED",
          "Venda transacional que baixa primeiro os itens mais próximos do vencimento",
          "Minha parte: funcionários, clientes e fornecedores (back e front)"
        ],
        techs: ["Java", "Spring Boot", "JPA/Hibernate", "MySQL", "iText", "Maven", "HTML", "CSS", "JavaScript", "Git", "Linux"],
        detalhes: "../meusprojetos/pharmaManager.html",
        codigo: "https://github.com/williamsilvaj/pharmacy-management-system",
        video: "https://www.youtube.com/watch?v=9_OfS8x_sEM",
        telas: [
          { src: "../images/pharmarec.png", legenda: "Tela inicial do PharmaManager" },
          { src: "../images/pharma/gerenFunci.png", legenda: "Gerenciamento de funcionários" },
          { src: "../images/pharma/func2.png", legenda: "Cadastro de funcionário" },
          { src: "../images/pharma/produtos2.png", legenda: "Controle de produtos e estoque" },
          { src: "../images/pharma/relatorio.png", legenda: "Relatórios de vendas" },
          { src: "../images/pharma/relaJPA.png", legenda: "Relacionamentos entre entidades JPA" }
        ]
      },
      {
        titulo: "Sentimentos em Pull Requests do Goose",
        categoria: "IA · PLN · Em equipe",
        descricao: "Análise de sentimento dos comentários de pull requests do projeto open source Goose, comparando três modelos Transformers com uma anotação manual.",
        destaques: [
          "194 comentários coletados pela API do GitHub, sem bots e com siglas expandidas",
          "Três modelos do Hugging Face com resultados bem diferentes entre si",
          "Minha parte: anotação manual, leitura do CSV e gráfico de sentimentos"
        ],
        techs: ["Python", "Hugging Face", "Transformers", "pandas", "Matplotlib", "seaborn", "GitHub API", "Google Colab"],
        detalhes: "../meusprojetos/sentimentoGoose.html",
        codigo: "https://github.com/inathanms/Evolucao_Software_2025-2_goose",
        video: "https://drive.google.com/file/d/1BBejlLXhqRkppvpKW08VY4GcJHsnLaVe/view?usp=sharing",
        capa: "grafico",
        telas: [
          { src: "../images/goose/rotulos-modelos.png", legenda: "Distribuição dos rótulos por modelo" },
          { src: "../images/goose/confianca-modelos.png", legenda: "Confiança média por classe e modelo" },
          { src: "../images/goose/media-global.png", legenda: "Média global por sentimento" }
        ]
      },
      {
        titulo: "Totem Aju — Informação Turística em Libras",
        categoria: "Visão computacional · Colaboração",
        descricao: "Totem para turistas surdos em Aracaju que reconhece sinais em Libras pela câmera e responde em texto e com o avatar do VLibras.",
        destaques: [
          "Landmarks do MediaPipe em vez de pixels: roda em tempo real na CPU",
          "Validação leave-one-signer-out para não inflar a acurácia",
          "Minha parte: proposta da abordagem por landmarks e protótipo de captura"
        ],
        techs: ["Python", "MediaPipe", "OpenCV", "scikit-learn", "VLibras", "pytest", "GitHub Actions"],
        detalhes: "../meusprojetos/totemAju.html",
        codigo: "https://github.com/athena272/totem-aju",
        capa: "tela",
        telas: [
          { src: "../images/totemaju/preview-vlibras.png", legenda: "Resposta em texto e no avatar do VLibras" },
          { src: "../images/totemaju/preview-orla.png", legenda: "Categorias e assuntos numerados para o menu por dedos" }
        ]
      },
      {
        titulo: "Detecção de Assinaturas em Lista de Presença",
        categoria: "Visão computacional",
        descricao: "Processamento de imagens para identificar e contar automaticamente as assinaturas de uma lista de presença digitalizada.",
        destaques: [
          "Binarização, recorte, estiramento horizontal e bordas com Sobel",
          "Limiar adaptativo calculado a partir do histograma",
          "Transformada de Hough filtrando linhas horizontais (5 de 5 no teste)"
        ],
        techs: ["Python", "OpenCV", "NumPy", "scikit-image", "Matplotlib", "Jupyter"],
        detalhes: "../meusprojetos/processamentoImagens.html",
        codigo: "https://github.com/Manoelmonteiro/subscription_count---image-process",
        video: "https://www.youtube.com/watch?v=tyE7xQx_QLA",
        telas: [
          { src: "../images/processamentoImagens.png", legenda: "Visão geral do projeto" },
          { src: "../images/pimages/image.png", legenda: "1. Imagem original em escala de cinza" },
          { src: "../images/pimages/binarizacao.png", legenda: "2. Binarização" },
          { src: "../images/pimages/dilatacao.png", legenda: "4. Recorte e estiramento horizontal" },
          { src: "../images/pimages/sobel.png", legenda: "5. Detecção de bordas com Sobel" },
          { src: "../images/pimages/resultadoF.png", legenda: "9. Resultado: assinaturas detectadas" }
        ]
      },
      {
        titulo: "PortScan — Varredura de Portas TCP",
        categoria: "Redes · Segurança",
        descricao: "Port scanner de linha de comando que encontra portas TCP abertas em um host e identifica o serviço de cada uma a partir de um CSV.",
        destaques: [
          "Sockets TCP com connect_ex() e timeout de 0,5 s por porta",
          "Correlação de portas com protocolo, serviço e descrição",
          "Feito para estudo, em hosts próprios ou com autorização"
        ],
        techs: ["Python", "Sockets", "CSV", "CLI", "Linux"],
        detalhes: "../meusprojetos/varreduraTCP.html",
        codigo: "https://github.com/Manoelmonteiro/PortScan",
        video: "https://www.youtube.com/watch?v=j2D3qyNidnc",
        telas: [
          { src: "../images/nmap.png", legenda: "Varredura de portas TCP" },
          { src: "../images/varreduraTCP/entrada.png", legenda: "Entrada via linha de comando" },
          { src: "../images/varreduraTCP/tempori.png", legenda: "Exemplo de saída da varredura" },
          { src: "../images/varreduraTCP/tcp.png", legenda: "Formato esperado do CSV" }
        ]
      }
    ];

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));

    function renderProjetos() {
      const visiveis = PROJETOS.map((p, i) => ({ ...p, i }));

      $("lista").innerHTML = visiveis.map((p) => `
        <article class="pj-card">
          <div class="pj-principal">
            <button type="button" class="pj-capa ${p.capa ? esc(p.capa) : ""}" data-proj="${p.i}" data-tela="0" aria-label="Ver telas de ${esc(p.titulo)}">
              <img src="${esc(p.telas[0].src)}" alt="${esc(p.telas[0].legenda)}" loading="lazy">
              <span>${p.telas.length} ${p.telas.length === 1 ? "tela" : "telas"}</span>
            </button>
            <div class="pj-info">
              <p class="pj-cat">${esc(p.categoria)}</p>
              <h2>${esc(p.titulo)}</h2>
              <p class="pj-desc">${esc(p.descricao)}</p>
              <ul class="pj-destaques">${p.destaques.map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
              <div class="pj-techs">${p.techs.map((t) =>
                `<span class="pj-tech">${esc(t)}</span>`).join("")}</div>
              <div class="pj-acoes">
                <a class="pj-btn primario" href="${esc(p.detalhes)}">Ver detalhes</a>
                ${p.site ? `<a class="pj-btn" href="${esc(p.site)}" target="_blank" rel="noopener">Site ↗</a>` : ""}
                ${p.codigo ? `<a class="pj-btn" href="${esc(p.codigo)}" target="_blank" rel="noopener">Código ↗</a>` : ""}
                ${p.video ? `<a class="pj-btn" href="${esc(p.video)}" target="_blank" rel="noopener">Vídeo ↗</a>` : ""}
              </div>
            </div>
          </div>
          ${p.telas.length > 1 ? `
          <div class="pj-telas" aria-label="Telas do projeto">
            ${p.telas.map((t, j) => `
              <button type="button" data-proj="${p.i}" data-tela="${j}" aria-label="Ampliar: ${esc(t.legenda)}">
                <img src="${esc(t.src)}" alt="${esc(t.legenda)}" loading="lazy">
              </button>`).join("")}
          </div>` : ""}
        </article>`).join("");
    }

    // ---------- visualizador de telas ----------
    const lb = $("lb");
    const atual = { proj: 0, tela: 0 };

    function mostrarTela() {
      const telas = PROJETOS[atual.proj].telas;
      const t = telas[atual.tela];
      $("lb-img").src = t.src;
      $("lb-img").alt = t.legenda;
      $("lb-legenda").innerHTML = `${esc(t.legenda)}<small>${atual.tela + 1} / ${telas.length}</small>`;
      lb.querySelectorAll(".pj-lb-ant, .pj-lb-prox").forEach((b) => (b.hidden = telas.length < 2));
    }

    function navegar(passo) {
      const n = PROJETOS[atual.proj].telas.length;
      atual.tela = (atual.tela + passo + n) % n;
      mostrarTela();
    }

    lb.addEventListener("click", (e) => {
      const acao = e.target.closest("[data-lb]")?.dataset.lb;
      if (acao === "fechar") return lb.close();
      if (acao) return navegar(Number(acao));
      if (e.target === lb || e.target.classList.contains("pj-lb-corpo")) lb.close();
    });

    lb.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") navegar(1);
      if (e.key === "ArrowLeft") navegar(-1);
    });

    // ---------- abrir telas ----------
    document.querySelector(".pj").addEventListener("click", (e) => {
      const tela = e.target.closest("[data-tela]");
      if (tela) {
        atual.proj = Number(tela.dataset.proj);
        atual.tela = Number(tela.dataset.tela);
        mostrarTela();
        lb.showModal();
      }
    });

    renderProjetos();
  </script>
</body>
</html>
